services:
  db:
    image: postgres:15-alpine
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    restart: always

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  price_monitor:
    build: ./backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    command: python -m workers.price_monitor.main
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  email_producer:
    build: ./backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    command: python -m workers.email_producer.main
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  email_consumer:
    build: ./backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    command: arq workers.email_consumer.worker_settings.WorkerSettings
    depends_on:
      redis:
        condition: service_started
    restart: always

volumes:
  postgres_data: